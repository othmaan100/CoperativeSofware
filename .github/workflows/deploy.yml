name: Deploy to cPanel (fesco.fcetpotiskum.com.ng)

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you run it manually from the Actions tab

concurrency:
  group: fesco-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2' # match the version set in cPanel MultiPHP Manager
          extensions: mbstring, pdo_mysql, openssl, fileinfo, gd, curl, intl, zip, dom
          tools: composer:v2

      - name: Install PHP dependencies (production)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build frontend assets (Vite + Tailwind)
        run: |
          npm ci
          npm run build

      # Quick check that GitHub can reach your FTP server at all.
      # If this step fails, the server/firewall is blocking GitHub, not the upload.
      - name: Test FTP connection
        run: |
          echo "Checking ${{ secrets.FTP_SERVER }} port 21..."
          timeout 20 bash -c "echo > /dev/tcp/${{ secrets.FTP_SERVER }}/21" \
            && echo "Port 21 reachable" \
            || (echo "::error::Cannot reach FTP server on port 21 from GitHub. Ask your host to allow GitHub Actions IPs (or unblock in cPanel > IP Blocker / Imunify360)." && exit 1)

      # Upload attempt 1
      - name: Upload to server over FTPS (attempt 1)
        id: ftp1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          security: loose      # accept the host's shared/self-signed FTP certificate
          timeout: 600000      # 10 minutes instead of the default 30 seconds
          log-level: standard
          local-dir: ./
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
            tests/**
            .env
            .env.*
            !.env.example
            public/storage
            public/storage/**
            public/uploads/**
            storage/app/public/**
            storage/app/private/**
            storage/app/backups/**
            storage/logs/*.log
            storage/framework/cache/data/**
            storage/framework/sessions/*
            storage/framework/views/*.php
            phpunit.xml

      # Upload attempt 2 (only runs if attempt 1 failed, e.g. a dropped connection)
      - name: Upload to server over FTPS (attempt 2)
        id: ftp2
        if: steps.ftp1.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          security: loose      # accept the host's shared/self-signed FTP certificate
          timeout: 600000      # 10 minutes instead of the default 30 seconds
          log-level: standard
          local-dir: ./
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
            tests/**
            .env
            .env.*
            !.env.example
            public/storage
            public/storage/**
            public/uploads/**
            storage/app/public/**
            storage/app/private/**
            storage/app/backups/**
            storage/logs/*.log
            storage/framework/cache/data/**
            storage/framework/sessions/*
            storage/framework/views/*.php
            phpunit.xml


      # Upload attempt 3
      - name: Upload to server over FTPS (attempt 3)
        if: steps.ftp1.outcome == 'failure' && steps.ftp2.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          security: loose      # accept the host's shared/self-signed FTP certificate
          timeout: 600000      # 10 minutes instead of the default 30 seconds
          log-level: standard
          local-dir: ./
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
            tests/**
            .env
            .env.*
            !.env.example
            public/storage
            public/storage/**
            public/uploads/**
            storage/app/public/**
            storage/app/private/**
            storage/app/backups/**
            storage/logs/*.log
            storage/framework/cache/data/**
            storage/framework/sessions/*
            storage/framework/views/*.php
            phpunit.xml
