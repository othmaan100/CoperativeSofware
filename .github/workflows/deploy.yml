name: Deploy to cPanel (fesco.fcetpotiskum.com.ng)

on:
  push:
    branches: [main]
  workflow_dispatch: # run it manually from the Actions tab
    inputs:
      full_upload:
        description: 'Re-upload every file (ignore what is already on the server)'
        type: boolean
        default: false

concurrency:
  group: fesco-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2' # match the version set in cPanel MultiPHP Manager
          extensions: mbstring, pdo_mysql, openssl, fileinfo, gd, curl, intl, zip, dom
          tools: composer:v2

      - name: Install PHP dependencies (production)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build frontend assets (Vite + Tailwind)
        run: |
          npm ci
          npm run build

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload to server over FTPS (lftp)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FULL_UPLOAD: ${{ github.event.inputs.full_upload || 'false' }}
        run: |
          # Credentials go in ~/.netrc so special characters in the password are safe
          printf 'machine %s\nlogin %s\npassword %s\n' "$FTP_SERVER" "$FTP_USERNAME" "$FTP_PASSWORD" > ~/.netrc
          chmod 600 ~/.netrc

          # Normal runs: only upload files whose size changed or that are new.
          # Full upload: send everything again.
          if [ "$FULL_UPLOAD" = "true" ]; then MODE=""; else MODE="--only-newer --ignore-time"; fi

          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ftp:ssl-protect-list true;
            set ssl:verify-certificate no;
            set ssl:priority 'NORMAL:-VERS-TLS1.3';
            set ftp:passive-mode true;
            set net:timeout 60;
            set net:max-retries 5;
            set net:reconnect-interval-base 5;
            set net:reconnect-interval-max 30;
            set xfer:clobber on;
            open -p 21 ftp://$FTP_SERVER;
            mirror --reverse --verbose --parallel=3 $MODE \
              --exclude '^\.git' \
              --exclude '^\.github/' \
              --exclude '^node_modules/' \
              --exclude '^tests/' \
              --exclude '^\.env' \
              --exclude '^phpunit\.xml$' \
              --exclude '^public/storage' \
              --exclude '^public/uploads/.' \
              --exclude '^storage/app/public/.' \
              --exclude '^storage/app/private/.' \
              --exclude '^storage/app/backups/.' \
              --exclude '^storage/logs/.' \
              --exclude '^storage/framework/cache/data/.' \
              --exclude '^storage/framework/sessions/.' \
              --exclude '^storage/framework/views/.' \
              ./ ./ ;
            bye
          "

          rm -f ~/.netrc
